<!DOCTYPE html>
<html lang="pt-BR">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Conversor Premium</title>
     <!-- Fonte Outfit -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
     <link rel="stylesheet" href="style.css">
</head>

<body>

     <!-- Efeito de luz no fundo -->
     <div class="ambient-light"></div>

     <main class="converter-card">
          <header>
               <div class="icon-box">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                         <path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"></path>
                    </svg>
               </div>
               <h1>Conversor Pro</h1>
               <p>Precisão e velocidade em um só lugar</p>
          </header>

          <div class="converter-body">
               <!-- Input de Valor -->
               <div class="input-wrapper">
                    <label for="valor-input">Valor</label>
                    <input type="number" id="valor-input" placeholder="0.00" step="any" autocomplete="off">
               </div>

               <!-- Área dos Selects e Botão Swap -->
               <div class="units-container">
                    <div class="select-wrapper">
                         <label for="de-select">De</label>
                         <select id="de-select">
                              <option value="C">Celsius (°C)</option>
                              <option value="F">Fahrenheit (°F)</option>
                         </select>
                    </div>

                    <!-- Botão Flutuante de Inverter -->
                    <button id="swap-btn" type="button" title="Inverter unidades">
                         <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                              stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                              <path d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4" />
                         </svg>
                    </button>

                    <div class="select-wrapper">
                         <label for="para-select">Para</label>
                         <select id="para-select">
                              <option value="F">Fahrenheit (°F)</option>
                              <option value="C">Celsius (°C)</option>
                         </select>
                    </div>
               </div>

               <!-- Botão Converter -->
               <button id="convert-btn" class="btn-convert">
                    <span>Converter</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                         <line x1="5" y1="12" x2="19" y2="12"></line>
                         <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
               </button>

               <!-- Área de Resultado (Inicialmente escondida) -->
               <div id="resultado-box" class="result-box hidden">
                    <span class="result-label">Resultado</span>
                    <div class="result-value-wrapper">
                         <h2 id="resultado-valor">0</h2>
                         <span id="resultado-unidade">°F</span>
                    </div>
               </div>
          </div>
     </main>

     <script src="script.js"></script>
</body>

</html>
